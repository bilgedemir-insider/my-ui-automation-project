name: UI Automations Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  run-ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - # UI Testlerini çalıştır ve çıktıyı bir JSON dosyasına yaz
      - name: Execute UI Tests
        run: npm run test:ui > main-report.json
        continue-on-error: true # Test fail etse bile raporu DB'ye yazabilmesi için devam etmesini sağlıyoruz

      # Test sonuçlarını MongoDB'ye kaydet
      - name: Log Results to MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node log-to-db.js

      # Raporları yükle (Eski adımınız kalabilir)
      - name: Upload Artifacts (Reports & Screenshots)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: playwright-report/
          retention-days: 14